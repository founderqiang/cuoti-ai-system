name: Bug report
description: 报告可复现的问题（请勿包含学生个人信息或 API 密钥）
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先匿名化所有输入、日志和截图。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期望什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动...
        2. 上传匿名化示例...
        3. 点击...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11 / Python 3.12 / 浏览器版本
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容不含真实学生信息或 API 密钥
          required: true
